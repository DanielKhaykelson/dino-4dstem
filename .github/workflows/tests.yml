name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The packaging layer only; the heavy scientific stack is not needed.
      - run: pip install pytest
      - run: pip install -e . --no-deps
      - run: pytest -q
      - name: build wheel
        run: pip install build && python -m build
